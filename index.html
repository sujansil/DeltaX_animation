<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000"><meta name="description" content="From darkness to DeltaX. A scroll-driven journey through chaos."><title>DeltaX — From a single point</title><style>
*{box-sizing:border-box}html{background:#000;color:#e9fff6;scrollbar-width:thin;scrollbar-color:#354940 #000}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#000}#journey{height:1150vh;height:1150svh}#viewport{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:#000}canvas{width:100%;height:100%;display:block}.hint{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);text-align:center;color:#81948a;font:9px monospace;letter-spacing:3px;opacity:0;transition:opacity 1s;white-space:nowrap}.hint.show{opacity:.75}.hint i{display:block;margin:16px auto 0;width:1px;height:35px;background:linear-gradient(#718f80,transparent)}header{position:fixed;top:30px;left:35px;right:35px;display:flex;justify-content:space-between;pointer-events:none;opacity:0;transition:opacity .5s}header.visible{opacity:1}.logo{font-size:21px;letter-spacing:-1px;color:#bdeed4}.label{font:9px monospace;letter-spacing:2px;color:#72887c}.rail{position:fixed;right:28px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:23px;opacity:0;transition:opacity .5s}.rail.visible{opacity:1}button{cursor:pointer;color:#a6c6b5;background:none;font:9px monospace;letter-spacing:1px}button:focus-visible{outline:1px solid #c1ffe0;outline-offset:6px}.rail button{width:7px;height:7px;border:1px solid #395144;padding:0;border-radius:50%}.rail button.active{background:#c3ffdf;border-color:#c3ffdf;box-shadow:0 0 12px #a5ffce66}.chapter{position:fixed;bottom:30px;left:35px;color:#758d7e;font:9px monospace;letter-spacing:2px;opacity:0;transition:opacity .5s}.chapter.visible{opacity:1}.progress{position:fixed;bottom:0;left:0;height:1px;background:#85c6a2;transform-origin:left;width:100%;transform:scaleX(0)}.replay{position:fixed;right:35px;bottom:30px;border:0;opacity:0;pointer-events:none;transition:opacity .5s}.replay.visible{opacity:1;pointer-events:auto}#error{display:none;position:fixed;inset:0;background:#000;align-items:center;justify-content:center;flex-direction:column;gap:20px;text-align:center;padding:24px}#error button{border:1px solid #56725f;padding:14px 20px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:600px){header{top:22px;left:22px;right:22px}.label{font-size:7px}.rail{right:15px}.chapter{left:22px;font-size:8px;bottom:24px}.replay{right:22px;bottom:24px}.hint{font-size:8px;letter-spacing:2px}}

.equations{position:fixed;left:35px;bottom:65px;max-width:min(530px,calc(100vw - 85px));pointer-events:none;opacity:0;transform:translateY(6px);transition:opacity .5s,transform .5s;color:#9eb7a9;text-shadow:0 1px 9px #000,0 0 16px #000;font:14px/1.65 Georgia,"Times New Roman",serif;letter-spacing:.2px}.equations.visible{opacity:.8;transform:translateY(0)}.equations .model{font:8px/1.6 monospace;letter-spacing:2px;color:#71877a;margin-bottom:8px}.equations .eq{overflow-wrap:anywhere}.equations .note{font:9px/1.6 monospace;color:#758b7e;margin-top:5px;letter-spacing:.3px}.equations sub,.equations sup{font-size:.72em;line-height:0}@media(max-width:600px){.equations{left:22px;bottom:60px;font-size:12px;max-width:calc(100vw - 65px)}.equations .model{font-size:8px}.equations .note{font-size:8px}}
</style></head><body><main id="journey" aria-label="Scroll to explore the DeltaX opening"><div id="viewport"><canvas id="canvas" aria-label="A dot drops into darkness, sends one ripple, transforms through nine forms of chaos, then traces DeltaX"></canvas><div class="hint" id="hint">SCROLL TO DISTURB THE SILENCE<i></i></div></div><div class="sr"><h1>DeltaX</h1><p>Scroll through darkness, a single ripple, nine merging chaos effects, and the DeltaX reveal.</p></div></main><header id="header"><span class="logo">ΔX</span><span class="label">FROM A SINGLE POINT</span></header><nav class="rail" id="rail" aria-label="Jump to scene"><button data-p="0" aria-label="Darkness"></button><button data-p="0.15" aria-label="Single ripple"></button><button data-p="0.405" aria-label="Explore the nine chaos effects"></button><button data-p="0.83" aria-label="Trace Delta X"></button><button data-p="1" aria-label="DeltaX reveal"></button></nav><div class="equations" id="equations" role="note" aria-label="Equation for the current effect"></div><div class="chapter" id="chapter"></div><button class="replay" id="replay">↥ BACK TO THE BEGINNING</button><div class="progress" id="progress"></div><div id="error" role="alert"><p>The animation could not start on this browser.</p><button id="retry">RETRY THE EXPERIENCE</button></div><script src="experience.js"></script></body></html>
